name: Deploy Admin

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install Dependencies
        run: |
          cd admin
          npm ci

      - name: Build React Admin
        run: |
          cd admin
          # If you have build-time env vars (e.g. VITE_API_URL), define them here:
          # VITE_API_URL: ${{ secrets.VITE_API_URL }}
          npm run build

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy to cPanel via rsync
        run: |
          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT || '22' }} -o StrictHostKeyChecking=no" --delete admin/dist/ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/rpcworldbd/admin.rpcworld-bd.com

