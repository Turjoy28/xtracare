name: Deploy Server

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: |
          cd server
          npm ci --omit=dev

      - name: Create Restart Trigger File
        run: |
          mkdir -p server/tmp
          touch server/tmp/restart.txt

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync Server Files via rsync
        run: |
          # Sync server folder (including node_modules and tmp/restart.txt)
          # Excludes local env files, git config, and user uploads to prevent overriding production data
          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT || '22' }}" --delete \
            --exclude=".env" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="uploads/" \
            server/ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/rpcworldbd/api.rpcworld-bd.com

